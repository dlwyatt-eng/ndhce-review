<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Process of Care Dashboard</title><link rel="stylesheet" href="poc-styles.css"></head><body><div class="shell">
<header><div><h1>📊 Process of Care Dashboard</h1><p class="sub">Your study map across the clinical care cycle.</p></div><div class="nav"><a class="button secondary" href="process-of-care.html">← Hub</a><button class="secondary" onclick="resetPOCProgress()">Reset</button></div></header>
<section class="card"><h2>Summary</h2><div id="sectionStats" class="stats"></div></section><section class="card"><h2>Recommended Next Step</h2><div id="recommendation"></div></section><section class="card"><h2>Concept Mastery</h2><div id="concepts"></div></section>
</div><script src="poc-common.js?v=3"></script><script>
renderMiniStats('sectionStats');const p=getProgress(),entries=Object.entries(p.concepts||{}).map(([name,x])=>({name,score:pct(x.correct,x.done),done:x.done,correct:x.correct})).sort((a,b)=>a.score-b.score);
const rec=document.getElementById('recommendation');if(!entries.length)rec.innerHTML='<p>Start with Random Practice to establish a baseline.</p><a class="button primary" href="poc-practice-session.html?mode=random">Start practice</a>';else{const weak=entries.filter(x=>x.score<70);rec.innerHTML=weak.length?`<p>Focus next on <b>${weak.slice(0,3).map(x=>x.name).join(', ')}</b>.</p><a class="button primary" href="poc-practice-session.html?mode=weak">Review weak areas</a>`:'<p>Your practised concepts are at or above 70%. Try the mock exam.</p><a class="button primary" href="poc-exam.html">Start mock exam</a>'}
const box=document.getElementById('concepts');box.innerHTML=entries.length?entries.map(x=>`<div class="mastery-row"><div class="mastery-label"><b>${x.name}</b><span>${x.score}% · ${x.correct}/${x.done}</span></div><div class="mastery-track"><div class="mastery-fill" style="width:${x.score}%"></div></div></div>`).join(''):'<p class="muted">No concept data yet.</p>';
</script></body></html>
