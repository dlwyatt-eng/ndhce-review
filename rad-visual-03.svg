  <path d="M150 75 C115 130,125 220,170 248 L183 330 L205 258 L227 330 L240 248 C285 220,295 130,260 75 Z"/>
  <path d="M330 75 C295 130,305 220,350 248 L363 330 L385 258 L407 330 L420 248 C465 220,475 130,440 75 Z"/>
</g>
<g fill="#080b0e" opacity=".55">
  <ellipse cx="250" cy="220" rx="42" ry="28"/>
  <ellipse cx="330" cy="220" rx="42" ry="28"/>
</g>
<text x="360" y="398" text-anchor="middle" fill="#e5e7eb" font-size="22">Diffuse radiolucency near the CEJ</text>

</svg>