<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Special Needs Dashboard</title><link rel="stylesheet" href="sn-styles.css"></head><body><div class="shell"><header><div><p class="tag">PERFORMANCE DASHBOARD</p><h1>Medical Conditions & Special Needs</h1></div><div class="nav"><a class="button secondary" href="special-needs.html">← Hub</a></div></header><section class="card"><div id="stats" class="stats"></div></section><section class="card"><h2>Concept performance</h2><div id="concepts"></div></section><section class="card"><button class="button danger" onclick="resetSNProgress()">Reset progress</button></section></div><script src="sn-common.js"></script><script>renderMiniStats('stats');const p=getProgress(),el=document.getElementById('concepts'),entries=Object.entries(p.concepts||{}).sort((a,b)=>pct(a[1].correct,a[1].done)-pct(b[1].correct,b[1].done));el.innerHTML=entries.length?entries.map(([n,x])=>`<div class="concept-row"><span>${n}</span><strong>${pct(x.correct,x.done)}%</strong><small>${x.correct}/${x.done}</small></div>`).join(''):'<p>No results yet. Complete practice or a mock exam to populate the dashboard.</p>';</script></body></html>
