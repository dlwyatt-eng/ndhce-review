</div><script src="indices-common.js"></script><script>const bank=[{"level": "Moderate", "stem": "Country A has DMFT 1.2 and GI 1.8. Country B has DMFT 3.4 and GI 0.5. Which country has the greater periodontal education and inflammation-control need?", "data": "A: low caries, high GI | B: higher caries, low GI", "choices": ["Country A", "Country B", "Equal need", "DMFT alone decides"], "answer": 0, "why": "GI reflects gingival inflammation, and Country A's GI is much higher.", "zh": "GI反映牙龈炎症，A国GI明显更高。", "rationales": [{}, {"en": "Country B's main signal is caries, not gingival inflammation.", "zh": "B国主要问题信号是龋病，而非牙龈炎症。"}, {"en": "The GI values are clearly different.", "zh": "两国GI数值明显不同。"}, {"en": "DMFT does not measure periodontal inflammation.", "zh": "DMFT不评估牙周炎症。"}]}, {"level": "Moderate", "stem": "A community has mean DMFT 6.8, GI 0.4, and OHI-S 0.7. What is the clearest priority?", "data": "High cumulative caries; low inflammation and relatively good oral hygiene.", "choices": ["Restorative and caries management", "Intensive periodontal surgery", "Plaque-control program only", "Fluorosis surveillance only"], "answer": 0, "why": "The dominant problem is high caries experience, not gingival inflammation or oral-hygiene debris.", "zh": "主要问题是高龋病经历，而非牙龈炎症或软垢。", "rationales": [{}, {"en": "The low GI does not support intensive periodontal surgery as the primary need.", "zh": "GI较低，不支持把牙周手术作为首要需求。"}, {"en": "OHI-S is already relatively low, so plaque control alone misses the main burden.", "zh": "OHI-S较低，仅做菌斑控制会忽略主要疾病负担。"}, {"en": "No fluorosis data are provided.", "zh": "题目未提供氟斑牙数据。"}]}, {"level": "Difficult", "stem": "School A has mean DMFT 2.0 with D=1.6. School B has mean DMFT 3.0 with D=0.2 and F=2.6. Where is immediate untreated restorative need greater?", "data": "A has lower total but much higher untreated D component.", "choices": ["School A", "School B", "Equal", "Cannot infer anything"], "answer": 0, "why": "The D component is the strongest clue to untreated caries requiring restorative attention.", "zh": "D分量最能提示需要修复处理的未治疗龋。", "rationales": [{}, {"en": "School B has more cumulative experience but most is filled.", "zh": "B校累积龋病更多，但大部分已充填。"}, {"en": "The untreated components are not equal.", "zh": "两校未治疗龋分量不同。"}, {"en": "The components allow a reasonable priority inference.", "zh": "DMFT分量可支持合理的优先级判断。"}]}, {"level": "Difficult", "stem": "A fluoride program is being evaluated. Which outcome most directly demonstrates reduced new caries experience over time?", "data": "Choose an index aligned to caries incidence/cumulative change.", "choices": ["Change in DMFT/DMFS in comparable cohorts", "Lower GI", "Lower PBI", "Higher Dean's Index"], "answer": 0, "why": "DMFT or DMFS change in comparable groups directly tracks caries experience; DMFS is more sensitive.", "zh": "在可比人群中DMFT或DMFS变化可直接反映龋病经历，DMFS更敏感。", "rationales": [{}, {"en": "GI measures gingival inflammation.", "zh": "GI评估牙龈炎症。"}, {"en": "PBI measures papillary bleeding.", "zh": "PBI评估龈乳头出血。"}, {"en": "A higher Dean's Index means more fluorosis, not program success.", "zh": "Dean指数升高表示氟斑牙更重，并非项目成功。"}]}, {"level": "Difficult", "stem": "Two national surveys report mean DMFT 2.5, but Country X sampled 12-year-olds and Country Y sampled 35-year-olds. What is the safest conclusion?", "data": "DMFT is cumulative and age-sensitive.", "choices": ["The countries have identical oral health", "Country X is definitely worse", "Age differences make direct comparison unsafe", "Country Y needs no treatment"], "answer": 2, "why": "Because DMFT accumulates with age, age-matched or age-standardized comparisons are needed.", "zh": "DMFT随年龄累积，应使用年龄匹配或标准化后再比较。", "rationales": [{"en": "Equal means across different ages do not imply equal oral health.", "zh": "不同年龄的相同均值不代表口腔健康相同。"}, {"en": "Country X may look concerning, but 'definitely worse' overstates the evidence.", "zh": "X国可能值得关注，但不能据此断言一定更差。"}, {}, {"en": "No treatment conclusion can be drawn from this alone.", "zh": "仅凭此数据不能断定Y国无需治疗。"}]}, {"level": "Exam Killer", "stem": "A population's mean DMFT is low because 70% are caries-free, while a small subgroup has very high disease. Which measure best exposes this inequality?", "data": "Skewed distribution with concentrated disease.", "choices": ["Mean only", "Significant Caries Index or full distribution", "GI", "OHI-S"], "answer": 1, "why": "The Significant Caries Index and distribution reveal disease concentrated in the highest-risk subgroup.", "zh": "显著龋病指数及完整分布可揭示疾病集中在高风险小群体。", "rationales": [{"en": "The mean can conceal a high-risk tail.", "zh": "平均值可能掩盖高风险尾部。"}, {}, {"en": "GI measures gingival inflammation, not caries inequality.", "zh": "GI评估牙龈炎症，不评估龋病不平等。"}, {"en": "OHI-S measures debris and calculus.", "zh": "OHI-S评估软垢和牙石。"}]}, {"level": "Exam Killer", "stem": "Country A has lower DMFT than Country B, but A has much higher untreated D and very low F. Which statement is most accurate?", "data": "Lower total can coexist with greater unmet care.", "choices": ["A automatically has better oral health", "B automatically needs more restorative care", "A may have greater unmet treatment need despite lower total", "No index can ever guide planning"], "answer": 2, "why": "A high untreated D component and low F can indicate poor access and greater unmet need despite a lower total.", "zh": "即使总DMFT较低，较高D和较低F也可能提示就医不足及更大未满足需求。", "rationales": [{"en": "A lower total does not automatically mean better access or lower current need.", "zh": "较低总分不自动代表更好就医或更低当前需求。"}, {"en": "Country B may have more treated disease rather than more unmet need.", "zh": "B国可能只是既往治疗更多。"}, {}, {"en": "Indices are imperfect but still useful when interpreted carefully.", "zh": "指数虽不完美，但谨慎解读仍有规划价值。"}]}, {"level": "Exam Killer", "stem": "A school sealant program reports lower mean DMFT after three years, but the second sample contains fewer high-risk neighbourhoods. What threatens the conclusion?", "data": "The sampled populations differ.", "choices": ["Selection bias/confounding", "The Hawthorne effect only", "Recall bias only", "No threat exists"], "answer": 0, "why": "Different population composition can create an apparent improvement unrelated to the intervention.", "zh": "样本人群构成不同可能造成与干预无关的表面改善。", "rationales": [{}, {"en": "Participant behaviour awareness is not the main issue described.", "zh": "题目主要问题不是参与者因被观察而改变行为。"}, {"en": "This is not based on inaccurate memory reports.", "zh": "这不是由回忆不准确造成的。"}, {"en": "The comparison is clearly threatened by non-comparable samples.", "zh": "不可比样本明显威胁结论。"}]}, {"level": "Exam Killer", "stem": "Limited funding can support one program. Community data show high D, low sealant coverage, low GI, and acceptable OHI-S in schoolchildren. What is the best first program?", "data": "Untreated caries and low sealant protection dominate.", "choices": ["School sealants plus caries referral pathway", "Periodontal surgery campaign", "Fluorosis treatment campaign", "Plaque disclosing only"], "answer": 0, "why": "Sealants and a referral pathway directly target the dominant untreated caries burden and prevention gap.", "zh": "窝沟封闭加转诊途径可直接针对未治疗龋和预防缺口。", "rationales": [{}, {"en": "Low GI does not support periodontal surgery as the priority.", "zh": "GI低，不支持优先开展牙周手术。"}, {"en": "No fluorosis burden is described.", "zh": "题目未描述氟斑牙负担。"}, {"en": "Plaque instruction alone is too narrow for the caries and access problem.", "zh": "仅做菌斑教育无法充分解决龋病和就医问题。"}]}, {"level": "Exam Killer", "stem": "Community A has high M and low D; Community B has high D and low M. Which statement best distinguishes their needs?", "data": "M suggests past tooth loss; D suggests current untreated decay.", "choices": ["A likely needs prevention only; B needs nothing", "A may need prosthetic/rehabilitative care; B needs restorative access", "Both require identical services", "M and D have the same meaning"], "answer": 1, "why": "High M may reflect accumulated tooth loss and rehabilitation needs; high D signals current untreated restorative need.", "zh": "M高可提示缺牙及修复康复需求；D高提示当前未治疗龋和修复服务需求。", "rationales": [{"en": "A may need rehabilitation, and B clearly needs care.", "zh": "A可能需要康复修复，B也明确需要治疗。"}, {}, {"en": "Their component patterns indicate different service needs.", "zh": "不同分量模式提示不同服务需求。"}, {"en": "M and D represent different outcomes.", "zh": "M和D代表不同疾病后果。"}]}];startQuiz(bank,'clinical','Clinical Reasoning');</script></body></html>
