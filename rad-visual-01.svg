<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
<title id="title">Panoramic positioning error</title>
<desc id="desc">Simplified panoramic diagram with narrow blurred anterior teeth.</desc>
<rect width="720" height="420" rx="24" fill="#151a20"/>

<path d="M80 230 Q360 70 640 230" fill="none" stroke="#d9dde2" stroke-width="24" stroke-linecap="round"/>
<g fill="#c7cdd4">
  <rect x="275" y="135" width="22" height="120" rx="9"/>
  <rect x="310" y="125" width="20" height="130" rx="8"/>
  <rect x="345" y="122" width="18" height="133" rx="8"/>
  <rect x="378" y="125" width="20" height="130" rx="8"/>
  <rect x="413" y="135" width="22" height="120" rx="9"/>
</g>
<g opacity=".35" stroke="#f8fafc" stroke-width="18">
  <path d="M330 95 Q300 210 340 330"/>
  <path d="M390 95 Q420 210 380 330"/>
</g>
<text x="360" y="385" text-anchor="middle" fill="#e5e7eb" font-size="22">Anterior teeth appear narrow and blurred</text>

</svg>