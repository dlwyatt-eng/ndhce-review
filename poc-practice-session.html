<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Process of Care Practice Session</title><link rel="stylesheet" href="poc-styles.css"></head><body><div class="shell" id="quiz">
<header><div><h1>📝 Practice Session</h1><p class="sub" id="modeTitle"></p></div><div class="nav"><a class="button secondary" href="poc-practice.html">← Practice menu</a></div></header>
<section class="card"><div class="progressbar"><div id="bar"></div></div><div class="quiz-tools"><p><span id="counter"></span> <span id="level" class="level"></span> <span id="concept" class="tag"></span></p><button id="bookmark" class="secondary">☆ Bookmark</button></div></section>
<section class="card"><h2 id="stem"></h2><div id="data" class="fact"></div><textarea id="workspace" class="workbox" placeholder="Clinical reasoning notes / 临床推理笔记"></textarea><div id="choices"></div><div id="feedback" class="feedback hidden"></div><button id="next" class="primary hidden">Next question →</button></section>
</div><script src="poc-data.js"></script><script src="poc-common.js"></script><script>
window.FULL_BANK=window.POC_BANK;const p=new URLSearchParams(location.search),mode=p.get('mode')||'random',concept=p.get('concept')||'';
const names={random:'Random Practice',weak:'Review Weak Areas',bookmarks:'Bookmarked Questions',concept:'Practice: '+concept};
document.getElementById('modeTitle').textContent=names[mode]||'Practice';startPractice(selectPracticeBank(window.FULL_BANK,mode,concept),names[mode]||'Practice');
</script></body></html>
