</div><script src="indices-common.js"></script><script>const bank=[{"level": "Easy", "stem": "A patient has 2 decayed permanent teeth, 1 tooth missing because of caries, and 3 filled permanent teeth. What is DMFT?", "data": "D = 2, M = 1, F = 3", "choices": ["4", "5", "6", "7"], "answer": 2, "why": "DMFT = 2 + 1 + 3 = 6.", "zh": "DMFT＝2＋1＋3＝6。", "steps": ["Confirm the teeth are permanent.", "Count only teeth missing because of caries.", "Add D + M + F."], "rationales": [{"en": "This omits two components.", "zh": "此答案漏掉了两个分量。"}, {"en": "This is one less than the correct sum.", "zh": "此答案比正确总和少1。"}, {}, {"en": "This overcounts by one.", "zh": "此答案多计1。"}]}, {"level": "Easy", "stem": "A child has d = 3, e = 1, and f = 2. What is deft?", "data": "d = 3, e = 1, f = 2", "choices": ["4", "5", "6", "7"], "answer": 2, "why": "deft = 3 + 1 + 2 = 6.", "zh": "deft＝3＋1＋2＝6。", "steps": ["Use lowercase components for primary teeth.", "Add d + e + f."], "rationales": [{"en": "This leaves out two affected teeth.", "zh": "漏掉了2颗受影响乳牙。"}, {"en": "This undercounts by one.", "zh": "少计1。"}, {}, {"en": "This overcounts by one.", "zh": "多计1。"}]}, {"level": "Moderate", "stem": "Eight students have DMFT scores 0, 1, 2, 3, 1, 0, 4, and 1. What is the mean DMFT?", "data": "Scores: 0,1,2,3,1,0,4,1", "choices": ["1.0", "1.25", "1.5", "1.75"], "answer": 2, "why": "The total is 12; 12 ÷ 8 = 1.5.", "zh": "总分12；12÷8＝1.5。", "steps": ["Add all scores to get 12.", "Divide by 8 participants."], "rationales": [{"en": "This would result from using a total of 8.", "zh": "这相当于错误地使用总分8。"}, {"en": "This would require a total of 10.", "zh": "这相当于总分10。"}, {}, {"en": "This would require a total of 14.", "zh": "这相当于总分14。"}]}, {"level": "Moderate", "stem": "In a class of 25 children, 10 have untreated caries. What is prevalence?", "data": "10 affected ÷ 25 examined", "choices": ["25%", "40%", "50%", "60%"], "answer": 1, "why": "10 ÷ 25 × 100 = 40%.", "zh": "10÷25×100＝40%。", "steps": ["Use affected people, not affected teeth.", "Divide by everyone examined.", "Multiply by 100."], "rationales": [{"en": "25% would be about 6 of 25, not 10.", "zh": "25%约为25人中的6人。"}, {}, {"en": "50% would require 12.5 of 25.", "zh": "50%需要25人中约12至13人。"}, {"en": "60% would require 15 affected children.", "zh": "60%需要15名患儿。"}]}, {"level": "Moderate", "stem": "Plaque is present on 18 of 72 surfaces. What is PCR?", "data": "18 ÷ 72 × 100", "choices": ["18%", "20%", "25%", "30%"], "answer": 2, "why": "18 ÷ 72 = 0.25, so PCR is 25%.", "zh": "18÷72＝0.25，因此PCR为25%。", "steps": ["Use positive surfaces as numerator.", "Divide by total scored surfaces.", "Convert to percent."], "rationales": [{"en": "This repeats the numerator instead of calculating a percentage.", "zh": "此答案只是重复分子18。"}, {"en": "This is not the quotient of 18 and 72.", "zh": "18除以72并非20%。"}, {}, {"en": "30% would equal 21.6 positive surfaces.", "zh": "30%相当于21.6个阳性牙面。"}]}, {"level": "Moderate", "stem": "DI-S is 1.2 and CI-S is 0.8. What is OHI-S?", "data": "OHI-S = DI-S + CI-S", "choices": ["0.4", "1.0", "2.0", "2.4"], "answer": 2, "why": "1.2 + 0.8 = 2.0.", "zh": "1.2＋0.8＝2.0。", "steps": ["Remember OHI-S combines debris and calculus.", "Add the two component scores."], "rationales": [{"en": "This subtracts instead of adding.", "zh": "此答案进行了减法。"}, {"en": "This averages the components incorrectly.", "zh": "此答案错误地取了平均值。"}, {}, {"en": "This adds an extra 0.4.", "zh": "此答案多加了0.4。"}]}, {"level": "Difficult", "stem": "A 12-year-old has D=2, M=0, F=1 in permanent teeth and d=3, e=1, f=0 in primary teeth. Which pair is correct?", "data": "Permanent and primary dentitions must be calculated separately.", "choices": ["DMFT 3; deft 4", "DMFT 4; deft 3", "DMFT 3; deft 3", "DMFT 2; deft 4"], "answer": 0, "why": "DMFT = 2+0+1 = 3; deft = 3+1+0 = 4.", "zh": "DMFT＝3；deft＝4。", "steps": ["Separate the two dentitions.", "Calculate each index independently."], "rationales": [{}, {"en": "This swaps the two results.", "zh": "此选项把两个结果颠倒了。"}, {"en": "This omits e=1 from deft.", "zh": "此选项漏计e＝1。"}, {"en": "This omits F=1 from DMFT.", "zh": "此选项漏计F＝1。"}]}, {"level": "Difficult", "stem": "Cohort A has total DMFT 240 among 80 people. Cohort B has total DMFT 315 among 105 people. Which statement is correct?", "data": "A: 240/80; B: 315/105", "choices": ["A has higher mean", "B has higher mean", "Both means are 3.0", "Totals alone prove B has more disease per person"], "answer": 2, "why": "Both 240÷80 and 315÷105 equal 3.0.", "zh": "两组平均DMFT均为3.0。", "steps": ["Do not compare raw totals across different cohort sizes.", "Calculate each mean."], "rationales": [{"en": "A's mean is not higher; it equals 3.0.", "zh": "A组平均值并不更高。"}, {"en": "B's larger total reflects its larger sample.", "zh": "B组总分较高主要因为样本更大。"}, {}, {"en": "Raw totals do not establish disease per person.", "zh": "原始总数不能说明人均疾病水平。"}]}, {"level": "Difficult", "stem": "Prevalence falls from 30% to 20%. What is the absolute reduction?", "data": "30% − 20%", "choices": ["10% relative", "10 percentage points", "33 percentage points", "50 percentage points"], "answer": 1, "why": "Absolute reduction is 10 percentage points.", "zh": "绝对下降为10个百分点。", "steps": ["Subtract final prevalence from initial prevalence.", "Use 'percentage points' for an absolute difference."], "rationales": [{"en": "This uses the wrong label; the absolute difference is in percentage points.", "zh": "绝对差应以百分点表示。"}, {}, {"en": "33% is closer to the relative reduction, not the absolute change.", "zh": "33%更接近相对下降，不是绝对变化。"}, {"en": "50 points is far larger than the observed change.", "zh": "50个百分点远大于实际变化。"}]}, {"level": "Exam Killer", "stem": "A tooth has a restoration and recurrent decay. How is it counted in DMFT?", "data": "One tooth; active recurrent caries is present.", "choices": ["D only", "F only", "Both D and F", "Neither"], "answer": 0, "why": "Count the tooth once. Active decay takes priority, so it is D.", "zh": "同一颗牙只计一次；活动性继发龋计为D。", "steps": ["Avoid double counting.", "Active disease is classified as decayed."], "rationales": [{}, {"en": "F alone would ignore the active recurrent lesion.", "zh": "只计F会忽略活动性继发龋。"}, {"en": "A single tooth cannot be counted twice in DMFT.", "zh": "同一颗牙不能在DMFT中重复计数。"}, {"en": "The tooth clearly has caries experience.", "zh": "该牙明确存在龋病经历。"}]}, {"level": "Exam Killer", "stem": "Two teeth are missing: one from trauma and one from caries. What is M?", "data": "Trauma loss = 1; caries loss = 1", "choices": ["0", "1", "2", "Cannot determine"], "answer": 1, "why": "Only the tooth missing because of caries contributes to M.", "zh": "只有因龋缺失的牙计入M，因此M＝1。", "steps": ["Identify why each tooth is missing.", "Exclude non-caries causes."], "rationales": [{"en": "This incorrectly excludes the caries-related loss.", "zh": "此答案错误地排除了因龋缺失牙。"}, {}, {"en": "This incorrectly includes trauma.", "zh": "此答案错误地把外伤缺牙计入。"}, {"en": "The causes are provided, so it can be determined.", "zh": "题目已提供缺失原因，可以判断。"}]}, {"level": "Exam Killer", "stem": "Country A and B both have mean DMFT 4.0. A has D=3.0, M=0.5, F=0.5; B has D=0.5, M=0.5, F=3.0. Which has greater unmet restorative need?", "data": "Compare components, not just totals.", "choices": ["Country A", "Country B", "Equal unmet need", "DMFT provides no useful clue"], "answer": 0, "why": "Country A has much more untreated decay in the D component.", "zh": "A国D分量更高，未治疗龋更多。", "steps": ["Break the total into D, M, and F.", "Use D as the strongest clue to current untreated restorative need."], "rationales": [{}, {"en": "Country B has more filled teeth, suggesting more disease has already been treated.", "zh": "B国充填牙更多，说明更多龋病已得到治疗。"}, {"en": "Equal totals do not mean equal unmet need.", "zh": "总分相同不代表未满足需求相同。"}, {"en": "DMFT components offer a useful, though incomplete, treatment-need signal.", "zh": "DMFT分量虽不完整，但可提供治疗需求线索。"}]}];startQuiz(bank,'calculation','Calculation Lab');</script></body></html>
