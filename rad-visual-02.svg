<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
<title id="title">SLOB localization pair</title>
<desc id="desc">Two simplified radiographs showing the object moving in the same direction as the tube shift.</desc>
<rect width="720" height="420" rx="24" fill="#151a20"/>

<g transform="translate(55,55)">
  <rect width="280" height="280" rx="18" fill="#252b32"/>
  <path d="M65 45 C35 95,45 190,85 220 L100 265 L120 225 L140 265 L155 220 C195 190,205 95,175 45 Z" fill="#d9dde2"/>
  <circle cx="190" cy="150" r="18" fill="#f4f4f5"/>
  <text x="140" y="310" text-anchor="middle" fill="#e5e7eb" font-size="20">Tube position 1</text>
</g>
<g transform="translate(385,55)">
  <rect width="280" height="280" rx="18" fill="#252b32"/>
  <path d="M65 45 C35 95,45 190,85 220 L100 265 L120 225 L140 265 L155 220 C195 190,205 95,175 45 Z" fill="#d9dde2"/>
  <circle cx="225" cy="150" r="18" fill="#f4f4f5"/>
  <text x="140" y="310" text-anchor="middle" fill="#e5e7eb" font-size="20">Tube shifted mesially</text>
</g>
<path d="M335 195 L385 195" stroke="#f8fafc" stroke-width="5" marker-end="url(#arrow)"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0 0 L0 6 L8 3 Z" fill="#f8fafc"/></marker></defs>

</svg>