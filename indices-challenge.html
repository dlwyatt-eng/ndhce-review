ower total", "No index can ever guide planning"], "answer": 2, "why": "A high untreated D component and low F can indicate poor access and greater unmet need despite a lower total.", "zh": "即使总DMFT较低，较高D和较低F也可能提示就医不足及更大未满足需求。", "rationales": [{"en": "A lower total does not automatically mean better access or lower current need.", "zh": "较低总分不自动代表更好就医或更低当前需求。"}, {"en": "Country B may have more treated disease rather than more unmet need.", "zh": "B国可能只是既往治疗更多。"}, {}, {"en": "Indices are imperfect but still useful when interpreted carefully.", "zh": "指数虽不完美，但谨慎解读仍有规划价值。"}]}, {"level": "Exam Killer", "stem": "A school sealant program reports lower mean DMFT after three years, but the second sample contains fewer high-risk neighbourhoods. What threatens the conclusion?", "data": "The sampled populations differ.", "choices": ["Selection bias/confounding", "The Hawthorne effect only", "Recall bias only", "No threat exists"], "answer": 0, "why": "Different population composition can create an apparent improvement unrelated to the intervention.", "zh": "样本人群构成不同可能造成与干预无关的表面改善。", "rationales": [{}, {"en": "Participant behaviour awareness is not the main issue described.", "zh": "题目主要问题不是参与者因被观察而改变行为。"}, {"en": "This is not based on inaccurate memory reports.", "zh": "这不是由回忆不准确造成的。"}, {"en": "The comparison is clearly threatened by non-comparable samples.", "zh": "不可比样本明显威胁结论。"}]}, {"level": "Exam Killer", "stem": "Limited funding can support one program. Community data show high D, low sealant coverage, low GI, and acceptable OHI-S in schoolchildren. What is the best first program?", "data": "Untreated caries and low sealant protection dominate.", "choices": ["School sealants plus caries referral pathway", "Periodontal surgery campaign", "Fluorosis treatment campaign", "Plaque disclosing only"], "answer": 0, "why": "Sealants and a referral pathway directly target the dominant untreated caries burden and prevention gap.", "zh": "窝沟封闭加转诊途径可直接针对未治疗龋和预防缺口。", "rationales": [{}, {
